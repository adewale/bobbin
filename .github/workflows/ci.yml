name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04  # the locked Playwright does not support Ubuntu 26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run Workers pool tests
        run: npm test

      - name: Run scale tests (serial)
        run: npm run test:slow

      - name: Run Node.js tests
        run: npm run test:real

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Seed local fixture
        run: npm run fixture:local -- --config wrangler.e2e.jsonc

      - name: Run E2E tests against the local fixture
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() && hashFiles('playwright-report/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
